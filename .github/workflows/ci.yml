name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    name: Native tests (${{ matrix.os }}, ${{ matrix.optimize }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        optimize: [Debug, ReleaseSafe]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: zig
      - name: Library tests
        run: zig build test -Doptimize=${{ matrix.optimize }}
      - name: Dependency-free consumer
        run: |
          empty_packages="$(mktemp -d)"
          zig build --build-file e2e/consumer/build.zig test --system "$empty_packages" -Doptimize=${{ matrix.optimize }}
  format-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: zig
      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src e2e
      - name: Build API documentation
        run: zig build docs -Doptimize=Debug
