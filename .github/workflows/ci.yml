name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: zig
      - name: Check
        run: |
          zig fmt --check build.zig build.zig.zon src e2e
          zig build test -Doptimize=Debug
          zig build test -Doptimize=ReleaseSafe
          zig build docs
      - name: Check consumer dependencies
        run: |
          # An empty system package directory catches dependencies even if CI has cached them.
          empty_packages="$(mktemp -d)"
          zig build --build-file e2e/consumer/build.zig test --system "$empty_packages"
          zig build --build-file e2e/consumer/build.zig test --system "$empty_packages" -Doptimize=ReleaseSafe
