name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z, no v prefix)'
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Validate release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const version = process.env.VERSION;
            if (context.ref !== 'refs/heads/main') throw new Error('Run this workflow from main');
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) throw new Error('Version must be X.Y.Z');

            const packageVersion = fs.readFileSync('build.zig.zon', 'utf8').match(/^\s*\.version = "([^"]+)"/m)?.[1];
            const bumpVersion = fs.readFileSync('.bumpversion.toml', 'utf8').match(/^current_version = "([^"]+)"/m)?.[1];
            const readme = fs.readFileSync('README.md', 'utf8');
            if (packageVersion !== version || bumpVersion !== version ||
                !readme.includes(`git+https://github.com/hashiiiii/zig-keymap#v${version}`)) {
              throw new Error('Commit the version bump on main before running this workflow');
            }

            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
              branch: 'main',
              event: 'push',
              status: 'success',
              per_page: 1,
            });
            if (data.workflow_runs.length === 0) throw new Error('CI must pass for this commit before releasing');
      - name: Tag tested commit
        run: |
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
      - name: Create release
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: `v${process.env.VERSION}`,
              generate_release_notes: true,
            });
