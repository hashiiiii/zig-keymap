name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z, no v prefix)'
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: jdx/mise-action@v4
        with:
          install_args: pipx:bump-my-version
      - name: Validate release
        id: version
        uses: actions/github-script@v9
        with:
          script: |
            const version = process.env.VERSION;
            if (context.ref !== 'refs/heads/main') throw new Error('Run this workflow from main');
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) throw new Error('Version must be X.Y.Z');

            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
              branch: 'main',
              status: 'success',
              per_page: 1,
            });
            if (data.workflow_runs.length === 0) throw new Error('CI must pass for this commit before releasing');

            const { stdout } = await exec.getExecOutput('bump-my-version', ['show', 'current_version']);
            core.setOutput('changed', version !== stdout.trim());
      - name: Bump version
        run: bump-my-version bump --new-version "$VERSION"
      - name: Commit version bump
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add build.zig.zon README.md .bumpversion.toml
          git commit -m "chore: release v$VERSION"
      - name: Tag and push
        run: |
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
      - name: Create release
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: `v${process.env.VERSION}`,
              generate_release_notes: true,
            });
