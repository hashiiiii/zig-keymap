name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z, no v prefix)'
        required: true

permissions:
  actions: write
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: pipx:bump-my-version
      - name: Validate release
        id: version
        uses: actions/github-script@v9
        with:
          script: |
            const version = process.env.VERSION;
            if (context.ref !== 'refs/heads/main') throw new Error('Run this workflow from main');
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) throw new Error('Version must be X.Y.Z');

            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
              branch: 'main',
              status: 'success',
              per_page: 1,
            });
            if (data.workflow_runs.length === 0) throw new Error('CI must pass for this commit before releasing');

            const { stdout } = await exec.getExecOutput('bump-my-version', ['show', 'current_version']);
            core.setOutput('changed', version !== stdout.trim());
      - name: Bump version
        run: bump-my-version bump --new-version "$VERSION"
      - name: Commit version bump
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.zig.zon README.md .bumpversion.toml
          git commit -m "chore: release v$VERSION"
      - name: Tag and push
        run: |
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
      - name: Create release
        uses: actions/github-script@v9
        env:
          VERSION_CHANGED: ${{ steps.version.outputs.changed }}
        with:
          script: |
            if (process.env.VERSION_CHANGED === 'true') {
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'ci.yml',
                ref: 'main',
              });
            }
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: `v${process.env.VERSION}`,
              generate_release_notes: true,
            });
