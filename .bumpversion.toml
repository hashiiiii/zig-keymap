[tool.bumpversion]
current_version = "0.3.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
commit = false
tag = false
allow_dirty = true

[[tool.bumpversion.files]]
filename = "build.zig.zon"
search = '.version = "{current_version}"'
replace = '.version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = "git+https://github.com/hashiiiii/zig-keymap#v{current_version}"
replace = "git+https://github.com/hashiiiii/zig-keymap#v{new_version}"
